services:
  - type: web
    name: invisible-telegram-backend
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:backend
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_AUTH_TOKEN
        sync: false
      - key: PORT
        value: "10001"
      - key: BACKEND_API_TOKEN
        generateValue: true
      - key: COORDINATOR_WS_URL
        sync: false
      - key: COORDINATOR_EXPECTED_HOSTNAME
        sync: false
      - key: COORDINATOR_REQUIRED_MODE
        sync: false
      - key: COORDINATOR_MRTD
        sync: false
      - key: COORDINATOR_INTEL_ROOT_FINGERPRINT
        sync: false
      - key: COORDINATOR_AZURE_MAA_ISSUER
        sync: false
      - key: COORDINATOR_AZURE_MAA_JWKS_URL
        sync: false
      - key: COORDINATOR_AZURE_MAA_POLICY_HASH
        sync: false

  - type: worker
    name: invisible-telegram-bot
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:telegram
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_AUTH_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BACKEND_API_TOKEN
        fromService:
          type: web
          name: invisible-telegram-backend
          envVarKey: BACKEND_API_TOKEN
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: invisible-telegram-backend
          property: hostport
