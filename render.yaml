services:
  - type: web
    name: invisible-telegram-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_AUTH_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: BACKEND_API_TOKEN
        generateValue: true
      - key: PORT
        value: "10000"
      - key: COORDINATOR_WS_URL
        sync: false
      - key: COORDINATOR_EXPECTED_HOSTNAME
        sync: false
      - key: COORDINATOR_REQUIRED_MODE
        sync: false
      - key: COORDINATOR_MRTD
        sync: false
      - key: COORDINATOR_INTEL_ROOT_FINGERPRINT
        sync: false
      - key: COORDINATOR_AZURE_MAA_ISSUER
        sync: false
      - key: COORDINATOR_AZURE_MAA_JWKS_URL
        sync: false
      - key: COORDINATOR_AZURE_MAA_POLICY_HASH
        sync: false
